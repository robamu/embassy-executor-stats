[package]
name = "stm32f0-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-executor-stats = { path = "..", features = ["cortex-m", "defmt"] }

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"

# TIM2 is used as the statistics counter, so the time driver runs on TIM3.
embassy-stm32 = { path = "../../embassy/embassy-stm32", features = ["defmt", "stm32f051r8", "time-driver-tim3", "memory-x", "unstable-pac"] }
embassy-executor = { path = "../../embassy/embassy-executor", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { path = "../../embassy/embassy-time", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
