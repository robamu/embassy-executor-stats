# The STM32F051 has a Cortex-M0 core.
[target.thumbv6m-none-eabi]
# Flashes the binary and prints the defmt log output via RTT.
runner = "probe-rs run --chip STM32F051R8Tx"
rustflags = [
  # Linker script from cortex-m-rt. It includes the memory.x file generated by embassy-stm32
  # through the memory-x feature.
  "-C", "link-arg=-Tlink.x",
  # Places the defmt format strings in a separate section which is not flashed to the target.
  "-C", "link-arg=-Tdefmt.x",
]

[build]
target = "thumbv6m-none-eabi"

[env]
DEFMT_LOG = "debug"
