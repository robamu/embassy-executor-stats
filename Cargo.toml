[package]
name = "embassy-executor-stats"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Run time statistics for embassy-executor tasks, executors and interrupts"
readme = "README.md"

[workspace]
members = ["stm32h7-app", "stm32f0-app"]
# The apps only build for their own targets, see their `.cargo/config.toml`.
default-members = ["."]

# One embassy revision for the library and the apps, so they share a single embassy-executor.
[workspace.dependencies]
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "5b5a005718ab2796657e0644e3c25d40be6264a2" }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy.git", rev = "5b5a005718ab2796657e0644e3c25d40be6264a2" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "5b5a005718ab2796657e0644e3c25d40be6264a2" }

[package.metadata.docs.rs]
# Includes the Cortex-M module, which the crate level docs link to.
features = ["cortex-m", "defmt"]
default-target = "thumbv7em-none-eabihf"
targets = ["thumbv7em-none-eabihf"]

[features]
## Cortex-M support: DWT cycle counter and interrupt identification through VECTACTIVE.
cortex-m = ["dep:cortex-m"]
## Printers for the statistics.
defmt = ["dep:defmt"]
## Stores the statistics in `heapless::FnvIndexMap` instead of `LinearMap`. Lookups are hashed,
## which is faster for large sizes. The sizes must be powers of two.
fnv-map = []

[dependencies]
embassy-executor = { workspace = true, features = ["trace", "metadata-name"] }
critical-section = "1"
heapless = "0.9"
cortex-m = { version = "0.7.6", optional = true }
defmt = { version = "1", optional = true }

[build-dependencies]
arm-targets = "0.4"

# Profiles only take effect in the workspace root.

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3 # <-
overflow-checks = true # <-

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3 # <-
overflow-checks = true # <-

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3 # <-
overflow-checks = false # <-

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3 # <-
overflow-checks = false # <-
