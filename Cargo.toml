[package]
name = "embassy-executor-stats"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["stm32h7-app", "va108xx-app"]
# The apps only build for their own targets, see their `.cargo/config.toml`.
default-members = ["."]

[package.metadata.docs.rs]
# Includes the Cortex-M module, which the crate level docs link to.
features = ["cortex-m", "defmt"]
default-target = "thumbv7em-none-eabihf"
targets = ["thumbv7em-none-eabihf"]

[features]
## Cortex-M support: DWT cycle counter and interrupt identification through VECTACTIVE.
cortex-m = ["dep:cortex-m"]
## Printers for the statistics.
defmt = ["dep:defmt"]
## Stores the statistics in `heapless::LinearMap` instead of `FnvIndexMap`. Lookups search
## linearly, which needs less code and memory for small sizes.
linear-map = []

[dependencies]
embassy-executor = { path = "../embassy/embassy-executor", features = ["trace", "metadata-name"] }
critical-section = "1"
heapless = "0.9"
cortex-m = { version = "0.7.6", optional = true }
defmt = { version = "1", optional = true }

[build-dependencies]
arm-targets = "0.4"

# Profiles only take effect in the workspace root.

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3 # <-
overflow-checks = true # <-

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3 # <-
overflow-checks = true # <-

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3 # <-
overflow-checks = false # <-

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3 # <-
overflow-checks = false # <-

# The VA108xx HAL depends on these crates.io versions. They are replaced by the local embassy
# checkout, so that only one copy of each embassy crate ends up in the program.
[patch.crates-io]
embassy-sync = { path = "../embassy/embassy-sync" }
embassy-time-driver = { path = "../embassy/embassy-time-driver" }
embassy-time-queue-utils = { path = "../embassy/embassy-time-queue-utils" }
