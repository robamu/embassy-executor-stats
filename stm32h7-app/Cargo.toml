[package]
name = "stm32h7-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-executor-stats = { path = "..", features = ["cortex-m", "defmt"] }

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"

embassy-stm32 = { workspace = true, features = ["defmt", "stm32h753zi", "time-driver-tim2", "memory-x", "unstable-pac"] }
embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
