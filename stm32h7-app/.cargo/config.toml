# The STM32H753 has a Cortex-M7 core with a double precision FPU, so we use the hard float target.
[target.thumbv7em-none-eabihf]
# Flashes the binary and prints the defmt log output via RTT.
# Use `probe-rs chip list | grep STM32H753` to find other package variants.
runner = "probe-rs run --chip STM32H753ZITx"
rustflags = [
  # Disables page alignment of sections. This is required when the flash or RAM regions in
  # memory.x are not aligned to 0x10000.
  "-C", "link-arg=--nmagic",
  # Linker script from cortex-m-rt. It includes the memory.x file generated by embassy-stm32
  # through the memory-x feature.
  "-C", "link-arg=-Tlink.x",
  # Places the defmt format strings in a separate section which is not flashed to the target.
  "-C", "link-arg=-Tdefmt.x",
]

[build]
target = "thumbv7em-none-eabihf"

[env]
# Compile time log level filter for defmt. Can be overridden per module, for example
# "info,embassy_stm32=warn".
DEFMT_LOG = "debug"
# 7 tasks and 1 measured interrupt. Two executors with a task each plus UART5 nest 5 contexts deep.
EMBASSY_EXECUTOR_STATS_MAX_TASKS = "8"
EMBASSY_EXECUTOR_STATS_MAX_IRQS = "4"
EMBASSY_EXECUTOR_STATS_MAX_NESTING = "8"
