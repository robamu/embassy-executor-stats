[package]
name = "va108xx-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-executor-stats = { path = "..", features = ["cortex-m", "defmt"] }

cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"

# Provides the embassy time driver on two TIM peripherals and its interrupt handlers.
va108xx-hal = { version = "0.14", features = ["defmt", "embassy-oc30-oc31"] }
embassy-executor = { path = "../../embassy/embassy-executor", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { path = "../../embassy/embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }

defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
